<!doctype html>
<html lang="{{locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="keywords" content="{{keywords}}">
  <link rel="canonical" href="{{canonical}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{ogImage}}">
  <link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/components.css">
  <link rel="stylesheet" href="/design-system/responsive.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>:root{--hero-image:url("{{heroImageUrl}}");}</style>
  <script type="application/ld+json">{{{jsonld}}}</script>
</head>
<body>
  <nav class="topnav">
    {{#each nav}}
    <a href="{{url}}">{{label}}</a>
    {{/each}}
  </nav>
  <main>
    {{{bodyHtml}}}
  </main>
  <footer class="site-footer">
    <div class="footer-brand">
      <span class="footer-logo">Global Travel Guide</span>
      <span class="footer-tag">Explore the world with smart travel planning.</span>
    </div>
    <nav class="footer-cols">
      <div class="footer-col">
        <h4>Explore</h4>
        <a href="/countries">Countries</a>
        <a href="/cities">Cities</a>
        <a href="/routes">Routes</a>
        <a href="/attractions">Attractions</a>
        <a href="/budgets">Budgets</a>
        <a href="/seasonals">Seasonals</a>
        <a href="/stories">Stories</a>
      </div>
      <div class="footer-col">
        <h4>About</h4>
        <a href="/about">About Us</a>
        <a href="/contact">Contact</a>
      </div>
    </nav>
    <p class="footer-copy">© 2026 Global Travel Guide</p>
  </footer>
</body>
</html>
