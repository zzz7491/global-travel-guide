<!doctype html>
<html lang="{{locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="keywords" content="{{keywords}}">
  <link rel="canonical" href="{{canonical}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{ogImage}}">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>:root{--hero-image:url("{{heroImageUrl}}");}</style>
  <script type="application/ld+json">{{{jsonld}}}</script>
</head>
<body>
  <nav class="topnav">
    {{#each nav}}
    <a href="{{url}}">{{label}}</a>
    {{/each}}
  </nav>
  <main>
    {{{bodyHtml}}}
  </main>
  <footer class="site-footer">
    <p>© 2026 Global Travel Guide</p>
    <p>全球旅行攻略与自由行路线指南</p>
    <p>提供全球目的地介绍、旅行路线规划、景点攻略、美食推荐及自由行参考信息。</p>
    <p class="footer-links">
      <a href="/about">关于我们</a> | <a href="/contact">联系我们</a> | <a href="/sitemap-page">网站地图</a>
    </p>
    <p>联系我们：<br>Email: moming2603@hotmail.com</p>
    <p>Website: https://travel.mootlsv.com</p>
    <p>运营主体：嘉兴市东诚信息咨询有限公司</p>
    <p>© 2026 Global Travel Guide. All Rights Reserved.</p>
  </footer>
</body>
</html>
