# =============================================================================
# Cloudflare 生态扩展预留配置
# -----------------------------------------------------------------------------
# 当前站点为「纯静态」：scripts/build.js 生成 public/ 后由 Cloudflare Pages 直接托管。
# 本文件为未来启用 D1 + R2 + Workers 的预留配置，现在不生效，请勿提交到 Pages 构建。
# 启用步骤见 ARCHITECTURE.md「平滑迁移到 D1 + Workers」一节。
# =============================================================================

name = "global-travel-guide"
# 纯静态阶段：Pages 直接托管 public/ 目录
pages_build_output_dir = "public"
# compatibility_date = "2026-01-01"

# -----------------------------------------------------------------------------
# 1) D1 Database（未来替代 data/*.json 的内容模型）
# -----------------------------------------------------------------------------
# [[d1_databases]]
# binding = "DB"
# database_name = "global-travel-guide"
# database_id   = "REPLACE_WITH_D1_ID"
# migrations_dir = "migrations"

# -----------------------------------------------------------------------------
# 2) R2 Storage（图片资源：hero / og / 内容图）
#    本地开发用 imageBaseUrl="/assets/img"；上线后改为 R2 公共访问地址，例如：
#    "imageBaseUrl": "https://img.mootlsv.com"
# -----------------------------------------------------------------------------
# [[r2_buckets]]
# binding    = "IMAGES"
# bucket_name = "global-travel-guide-img"
# # 建议绑定自定义域：img.mootlsv.com  ->  R2

# -----------------------------------------------------------------------------
# 3) Workers / Pages Functions（动态渲染，复用 src/templates）
#    在 functions/ 下放置渲染函数，使用 DB 查询数据 + 同一套模板生成 HTML，
#    即可从「构建期静态生成」切换为「请求期动态生成」，无需改动内容模型。
